<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BenevolentGemini</title>
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- HTML2PDF for seamless PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            /* Default Theme Variables */
            --bg-body: #1e1e1e;
            --bg-sidebar: #252526;
            --bg-topbar: #2d2d30;
            --bg-input: #2d2d30;
            --text-main: #d4d4d4;
            --text-muted: #888;
            --border-color: #3e3e42;
            --accent: #444;
            --accent-hover: #555;
            --btn-text: #fff;
            --font-family: sans-serif;
            --font-size: 16px;
        }

        /* Themes */
        body.theme-night {
            --bg-body: #1e1e1e; --bg-sidebar: #252526; --bg-topbar: #2d2d30; --bg-input: #2d2d30;
            --text-main: #d4d4d4; --text-muted: #888; --border-color: #3e3e42;
            --accent: #444; --accent-hover: #555; --btn-text: #fff;
        }
        body.theme-classic {
            --bg-body: #f5f5f5; --bg-sidebar: #e0e0e0; --bg-topbar: #dfdfdf; --bg-input: #ffffff;
            --text-main: #111; --text-muted: #555; --border-color: #ccc;
            --accent: #d0d0d0; --accent-hover: #bebebe; --btn-text: #111;
        }
        body.theme-grayscale {
            --bg-body: #efefef; --bg-sidebar: #e5e5e5; --bg-topbar: #dfdfdf; --bg-input: #f7f7f7;
            --text-main: #1c1c1c; --text-muted: #666; --border-color: #b0b0b0;
            --accent: #cccccc; --accent-hover: #bbbbbb; --btn-text: #111;
        }
        body.theme-sepia {
            --bg-body: #f6eedb; --bg-sidebar: #ede6d6; --bg-topbar: #ebdcc0; --bg-input: #fcf6e8;
            --text-main: #3b2f2f; --text-muted: #7c7263; --border-color: #d4c5a9;
            --accent: #dfceb0; --accent-hover: #d2bf9c; --btn-text: #332424;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Mobile Viewport Fix */
        html { height: -webkit-fill-available; }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size);
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            position: fixed; 
            width: 100%;
            transition: background-color 0.2s;
        }

        /* Layout */
        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            min-height: 0; 
        }

        /* Sidebar Internals */
        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9em;
        }
        
        .sidebar-actions { padding: 10px; display: flex; gap: 5px; }
        
        #chat-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .chat-tab {
            padding: 10px;
            margin-bottom: 5px;
            background-color: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }
        .chat-tab:hover { background-color: var(--accent); }
        .chat-tab.active { background-color: var(--accent); border-left: 3px solid var(--text-main); }
        .delete-tab { color: var(--text-muted); cursor: pointer; padding: 2px 5px; }
        .delete-tab:hover { color: red; }

        /* Topbar & Dropdown */
        #topbar {
            height: 50px;
            background-color: var(--bg-topbar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .menu-btn {
            display: none;
            background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; margin-right: 15px;
        }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0; background-color: var(--bg-sidebar);
            min-width: 170px; box-shadow: 0px 8px 16px rgba(0,0,0,0.4); z-index: 2000;
            border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden;
        }
        .dropdown-content a {
            color: var(--text-main); padding: 10px 15px; text-decoration: none; display: block; font-size: 0.9em;
        }
        .dropdown-content a:hover { background-color: var(--accent); }
        .dropdown:hover .dropdown-content { display: block; }

        /* Buttons & Inputs */
        button {
            background-color: var(--accent); color: var(--btn-text);
            border: 1px solid var(--border-color); padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        select, input[type="text"] {
            background-color: var(--bg-input); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px; border-radius: 4px;
            font-family: inherit;
        }

        /* Floating Prompt Button */
        #floating-prompt-btn {
            display: none; 
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }

        /* Chat Area */
        #chat-window {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 80px; 
        }
        
        .reading-width {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message { padding: 15px; border-radius: 6px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); overflow-wrap: break-word; }
        .msg-user { border-left: 4px solid #4a90e2; }
        .msg-ai { border-left: 4px solid #50e3c2; }
        .msg-news { border-left: 4px solid #f5a623; } 
        
        .message img { max-width: 250px; border-radius: 4px; margin-bottom: 10px; display: block; }
        .message-content { line-height: 1.6; }
        .message-content pre { background-color: #000; color: #fff; padding: 10px; overflow-x: auto; border-radius: 4px; }
        .message-content code { font-family: monospace; background-color: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 3px; }

        /* Input Area (Bottom) */
        #input-area {
            background-color: var(--bg-topbar);
            border-top: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0; 
        }
        
        .input-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 0.9em; }
        textarea {
            width: 100%; height: 80px; resize: none; background-color: var(--bg-input); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-family: inherit; font-size: inherit;
        }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: var(--bg-sidebar); padding: 20px; border-radius: 6px;
            width: 90%; max-width: 400px; border: 1px solid var(--border-color);
        }
        .modal h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        /* Zen Mode (Read Mode) Overrides */
        body.zen-mode #sidebar,
        body.zen-mode #topbar,
        body.zen-mode #input-area,
        body.zen-mode #floating-prompt-btn {
            display: none !important;
        }
        body.zen-mode #chat-window {
            padding: 40px 15px;
        }

        /* Mobile Responsiveness */
        .mobile-close-btn { display: none; }
        @media (max-width: 768px) {
            #sidebar {
                position: absolute; left: -260px; height: 100%;
            }
            #sidebar.show { left: 0; }
            .menu-btn { display: block; }
            .mobile-close-btn { display: block; background: none; border: none; color: var(--text-main); font-size: 20px; padding: 0 10px; }
            .reading-width { max-width: 100%; }
        }
    </style>
</head>
<body class="theme-sepia">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div>BenevolentGemini<br><span style="font-size: 0.8em; font-weight: normal;">by Dr. Bishnu Goswami</span></div>
            <button class="mobile-close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="sidebar-actions">
            <button onclick="createNewChat()" style="flex:1;">✨ New Tab</button>
        </div>
        <div id="chat-list"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <!-- TOPBAR -->
        <div id="topbar">
            <div style="display: flex; align-items: center;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <strong id="current-chat-title">New Chat</strong>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                
                <!-- READ MODE (ZEN) -->
                <button onclick="toggleZenMode()" title="Hide UI for full screen reading">📖 Read</button>

                <!-- EXPORT / IMPORT SUB-MENU -->
                <div class="dropdown">
                    <button class="dropbtn">📁 Manage ▾</button>
                    <div class="dropdown-content">
                        <!-- JSON Data Restoration -->
                        <a href="#" onclick="exportData('current')">📦 Export Current Tab</a>
                        <a href="#" onclick="exportData('all')">📚 Export All Tabs</a>
                        <a href="#" onclick="document.getElementById('importBackup').click()">📥 Import Tabs</a>
                        <input type="file" id="importBackup" style="display:none" accept=".json" onchange="importData(event)">
                        
                        <div style="border-top: 1px solid var(--border-color); margin: 4px 0;"></div>
                        
                        <!-- Legacy Document Printing -->
                        <a href="#" onclick="exportDocument('docx')">📝 Export Word (.doc)</a>
                        <a href="#" onclick="exportDocument('pdf')">📄 Export PDF (.pdf)</a>
                    </div>
                </div>

                <button onclick="openSettings()" style="font-size: 1.2em; padding: 4px 8px;">🚀</button>
            </div>
        </div>

        <!-- CHAT DISPLAY -->
        <div id="chat-window">
            <div class="reading-width" id="messages-container"></div>
        </div>

        <!-- FLOATING ZEN EXIT BUTTON -->
        <button id="exit-zen-btn" onclick="toggleZenMode()" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; border-radius: 50px; padding: 12px 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            ✕ Exit Read Mode
        </button>

        <!-- FLOATING PROMPT RAISE BUTTON -->
        <button id="floating-prompt-btn" onclick="showInputArea()">
            💬 New Prompt
        </button>

        <!-- INPUT AREA -->
        <div id="input-area">
            <div class="reading-width">
                <textarea id="prompt-input" placeholder="Type your prompt here..."></textarea>
                <div class="input-controls" style="margin-top: 10px;">
                    <label>Key: <select id="key-select"></select></label>
                    <label>
                        <input type="checkbox" id="news-mode-toggle" onchange="updateModelList()"> 🌐 News/Search
                    </label>
                    <label>Model: <select id="model-select"></select></label>
                    
                    <button onclick="document.getElementById('imageFile').click()">📎 Attach</button>
                    <input type="file" id="imageFile" style="display:none" accept="image/*" onchange="handleImageSelect(event)">
                    <span id="image-name" style="color: var(--text-muted); font-style: italic; font-size: 0.8em;"></span>
                    
                    <div style="flex-grow: 1;"></div>
                    <button id="send-btn" onclick="sendMessage()" style="font-weight: bold;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ Settings</h3>
            <div class="form-group">
                <label>Add API Key:</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="new-api-key" placeholder="Paste Gemini API Key..." style="flex:1;">
                    <button onclick="addApiKey()">Add</button>
                </div>
            </div>
            <div class="form-group">
                <label>Theme:</label>
                <select id="theme-select" onchange="updateSettingsFromUI()">
                    <option value="theme-sepia">Warm Sepia</option>
                    <option value="theme-night">Night Mode</option>
                    <option value="theme-classic">Classic Light</option>
                    <option value="theme-grayscale">Intelligent Grayscale</option>
                </select>
            </div>
            <div class="form-group">
                <label>Font Size:</label>
                <input type="range" id="font-size-slider" min="12" max="24" value="16" onchange="updateSettingsFromUI()">
            </div>
            <div class="modal-actions">
                <button onclick="closeSettings()">Done</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const REGULAR_MODELS = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.1-pro-preview"];
        const NEWS_MODELS = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-2.0-flash-lite"];
        
        // --- STATE ---
        let appState = {
            keys: [],
            chats: [], 
            activeChatId: null,
            theme: "theme-sepia", 
            fontSize: "16px"
        };

        let currentAttachedImage = null; 
        let currentAttachedImageName = "";

        // --- INIT ---
        function init() {
            loadState();
            applyThemeAndFont();
            initSettingsUI();
            updateKeyDropdown();
            updateModelList();
            
            if (appState.chats.length === 0) {
                createNewChat();
            } else {
                if (!appState.chats.find(c => c.id === appState.activeChatId)) {
                    appState.activeChatId = appState.chats[0].id;
                }
                renderSidebar();
                renderChat();
            }
        }

        // --- STORAGE ---
        function loadState() {
            const saved = localStorage.getItem('benevolentGeminiState');
            if (saved) {
                appState = { ...appState, ...JSON.parse(saved) };
            }
        }

        function saveState() {
            localStorage.setItem('benevolentGeminiState', JSON.stringify(appState));
        }

        // --- UI UPDATES & SETTINGS ---
        function applyThemeAndFont() {
            document.body.className = appState.theme;
            document.documentElement.style.setProperty('--font-size', appState.fontSize);
        }

        function initSettingsUI() {
            document.getElementById('theme-select').value = appState.theme;
            document.getElementById('font-size-slider').value = parseInt(appState.fontSize);
        }

        function updateSettingsFromUI() {
            appState.theme = document.getElementById('theme-select').value;
            appState.fontSize = document.getElementById('font-size-slider').value + "px";
            applyThemeAndFont();
            saveState();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }

        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            const isZen = document.body.classList.contains('zen-mode');
            document.getElementById('exit-zen-btn').style.display = isZen ? 'block' : 'none';
        }

        // --- INPUT MINIMIZATION LOGIC ---
        function hideInputArea() {
            document.getElementById('input-area').style.display = 'none';
            document.getElementById('floating-prompt-btn').style.display = 'block';
        }

        function showInputArea() {
            document.getElementById('input-area').style.display = 'flex';
            document.getElementById('floating-prompt-btn').style.display = 'none';
            
            setTimeout(() => {
                document.getElementById('prompt-input').focus();
                const windowDiv = document.getElementById('chat-window');
                windowDiv.scrollTop = windowDiv.scrollHeight;
            }, 50);
        }

        function updateKeyDropdown() {
            const sel = document.getElementById('key-select');
            sel.innerHTML = '';
            appState.keys.forEach((key, idx) => {
                const mask = key.length > 4 ? `Key ${idx+1} (...${key.slice(-4)})` : `Key ${idx+1}`;
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = mask;
                sel.appendChild(opt);
            });
        }

        function updateModelList() {
            const isNews = document.getElementById('news-mode-toggle').checked;
            const models = isNews ? NEWS_MODELS : REGULAR_MODELS;
            const sel = document.getElementById('model-select');
            sel.innerHTML = '';
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                sel.appendChild(opt);
            });
        }

        // --- CHAT MANAGEMENT ---
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2); }

        function createNewChat() {
            const now = new Date();
            const title = "Chat " + now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const newChat = { id: generateId(), title: title, history: [] };
            appState.chats.unshift(newChat);
            appState.activeChatId = newChat.id;
            saveState();
            renderSidebar();
            renderChat();
            showInputArea(); 
            
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('show');
            }
        }

        function selectChat(id) {
            appState.activeChatId = id;
            saveState();
            renderSidebar();
            renderChat();
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('show');
            }
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if(confirm("Delete this tab entirely?")) {
                appState.chats = appState.chats.filter(c => c.id !== id);
                if (appState.activeChatId === id) {
                    appState.activeChatId = appState.chats.length > 0 ? appState.chats[0].id : null;
                }
                if (appState.chats.length === 0) createNewChat();
                saveState();
                renderSidebar();
                renderChat();
            }
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            appState.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-tab ${chat.id === appState.activeChatId ? 'active' : ''}`;
                div.onclick = () => selectChat(chat.id);
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = chat.title;
                titleSpan.style.overflow = "hidden";
                titleSpan.style.textOverflow = "ellipsis";
                titleSpan.style.whiteSpace = "nowrap";

                const delBtn = document.createElement('span');
                delBtn.className = 'delete-tab';
                delBtn.textContent = '✕';
                delBtn.onclick = (e) => deleteChat(chat.id, e);

                div.appendChild(titleSpan);
                div.appendChild(delBtn);
                list.appendChild(div);
            });
        }

        function renderChat() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            const activeChat = appState.chats.find(c => c.id === appState.activeChatId);
            if (!activeChat) return;

            document.getElementById('current-chat-title').textContent = activeChat.title;

            activeChat.history.forEach(msg => {
                const div = document.createElement('div');
                let styleClass = msg.role === 'user' ? 'msg-user' : 'msg-ai';
                if (msg.role === 'user' && msg.isNews) styleClass = 'msg-news';
                
                div.className = `message ${styleClass}`;
                
                let contentHTML = "";
                if (msg.role === 'user' && msg.isNews) contentHTML += `<strong>🌐 News/Web Search Request</strong><br><br>`;
                
                if (msg.image) {
                    contentHTML += `<img src="data:${msg.image.mimeType};base64,${msg.image.data}" />`;
                }
                
                const parsedText = marked.parse(msg.text || "");
                contentHTML += `<div class="message-content">${parsedText}</div>`;
                
                div.innerHTML = contentHTML;
                container.appendChild(div);
            });

            const windowDiv = document.getElementById('chat-window');
            windowDiv.scrollTop = windowDiv.scrollHeight;
        }

        // --- MANAGE DATA: JSON EXPORT & IMPORT ---
        function exportData(mode) {
            let dataToExport = [];
            let filename = "BenevolentGemini_Backup.json";
            const dateStr = new Date().toISOString().slice(0, 10);

            if (mode === 'current') {
                const activeChat = appState.chats.find(c => c.id === appState.activeChatId);
                if (!activeChat || activeChat.history.length === 0) {
                    alert("Current tab is empty.");
                    return;
                }
                // Export as an array so the import parser handles it universally
                dataToExport = [activeChat]; 
                const safeTitle = activeChat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                filename = `BG_Tab_${safeTitle}_${dateStr}.json`;
            } else if (mode === 'all') {
                if (appState.chats.length === 0) {
                    alert("No tabs to export.");
                    return;
                }
                dataToExport = appState.chats;
                filename = `BG_AllTabs_${dateStr}.json`;
            }

            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let importedData = JSON.parse(e.target.result);
                    
                    // Normalize backward compatibility: if old backup was a single object, wrap it in array
                    if (!Array.isArray(importedData)) {
                        importedData = [importedData];
                    }

                    if (importedData.length === 0) throw new Error("Empty backup file.");

                    let firstNewId = null;

                    importedData.forEach(chat => {
                        // Validate basic chat structure
                        if (chat.title && chat.history) {
                            chat.id = generateId(); // Overwrite ID to prevent target PC collisions
                            if (!firstNewId) firstNewId = chat.id;
                            appState.chats.unshift(chat); // Prepend to top of list
                        }
                    });

                    if (!firstNewId) throw new Error("No valid chat data found in file.");

                    saveState();
                    selectChat(firstNewId);
                } catch (err) {
                    alert("Invalid JSON format or corrupted backup file.");
                }
            };
            reader.readAsText(file);
            event.target.value = ""; 
        }

        // --- LEGACY EXPORT: WORD / PDF ---
        function exportDocument(format) {
            const activeChat = appState.chats.find(c => c.id === appState.activeChatId);
            if (!activeChat || activeChat.history.length === 0) {
                alert("Nothing to export yet.");
                return;
            }
            
            const safeTitle = activeChat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();

            if (format === 'docx') {
                let html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>";
                html += `<head><meta charset='utf-8'><title>${activeChat.title}</title></head><body style="font-family: Arial, sans-serif;">`;
                html += `<h2>${activeChat.title}</h2><hr>`;
                
                activeChat.history.forEach(msg => {
                    const speaker = msg.role === 'user' ? 'You' : 'Gemini';
                    html += `<h3>${speaker}</h3>`;
                    html += `<div>${marked.parse(msg.text)}</div><br>`;
                });
                
                html += "</body></html>";
                
                const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${safeTitle}.doc`;
                a.click();
                URL.revokeObjectURL(url);
            }
            else if (format === 'pdf') {
                const element = document.getElementById('messages-container');
                const opt = {
                    margin:       0.5,
                    filename:     `${safeTitle}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, backgroundColor: document.body.className === 'theme-night' ? '#1e1e1e' : '#ffffff' },
                    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            }
        }

        // --- SETTINGS MODAL HANDLING ---
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        function addApiKey() {
            const input = document.getElementById('new-api-key');
            const key = input.value.trim();
            if (key && !appState.keys.includes(key)) {
                appState.keys.push(key);
                saveState();
                updateKeyDropdown();
                input.value = '';
                document.getElementById('key-select').selectedIndex = appState.keys.length - 1;
            }
        }

        // --- FILE ATTACHMENT ---
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            currentAttachedImageName = file.name;
            document.getElementById('image-name').textContent = `Attached: ${currentAttachedImageName}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const result = e.target.result;
                const commaIdx = result.indexOf(',');
                currentAttachedImage = {
                    mimeType: file.type,
                    data: result.substring(commaIdx + 1)
                };
            };
            reader.readAsDataURL(file);
            event.target.value = "";
        }

        function clearImage() {
            currentAttachedImage = null;
            currentAttachedImageName = "";
            document.getElementById('image-name').textContent = "";
        }

        // --- API LOGIC ---
        async function sendMessage() {
            const inputEl = document.getElementById('prompt-input');
            const prompt = inputEl.value.trim();
            const apiKey = document.getElementById('key-select').value;
            const modelSelect = document.getElementById('model-select');
            const model = modelSelect.value;
            const isNews = document.getElementById('news-mode-toggle').checked;
            
            if (!apiKey) {
                alert("Please add an API Key in Settings first (🚀).");
                return;
            }
            if (!prompt && !currentAttachedImage) return;

            const activeChat = appState.chats.find(c => c.id === appState.activeChatId);
            
            const apiHistory = activeChat.history.map(msg => ({
                role: msg.role,
                parts: [{ text: msg.text }]
            }));

            const userMsg = { role: 'user', text: prompt || "Describe this image.", image: currentAttachedImage, isNews: isNews };
            activeChat.history.push(userMsg);
            
            if (activeChat.history.length === 1) {
                activeChat.title = prompt.substring(0, 20) + "...";
            }
            
            saveState();
            renderChat();

            const container = document.getElementById('messages-container');
            const thinkingHTML = `<div class="message msg-ai" id="temp-thinking"><em>Thinking...</em></div>`;
            container.insertAdjacentHTML('beforeend', thinkingHTML);
            
            const windowDiv = document.getElementById('chat-window');
            windowDiv.scrollTop = windowDiv.scrollHeight;

            inputEl.value = "";
            const savedImage = currentAttachedImage; 
            clearImage();

            hideInputArea();

            let userParts = [];
            if (prompt) userParts.push({ text: prompt });
            if (savedImage) {
                userParts.push({
                    inline_data: {
                        mime_type: savedImage.mimeType,
                        data: savedImage.data
                    }
                });
            }

            const payload = {
                contents: [
                    ...apiHistory,
                    { role: "user", parts: userParts }
                ]
            };

            if (isNews) {
                payload.tools = [{ googleSearch: {} }];
            }

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP Error ${response.status}`);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                activeChat.history.push({ role: 'model', text: aiText });
                
                saveState();
                renderChat(); 

            } catch (error) {
                console.error(error);
                let errStr = error.toString().toLowerCase();
                
                inputEl.value = prompt;
                if (savedImage) {
                    currentAttachedImage = savedImage;
                    document.getElementById('image-name').textContent = "Recovered attached image.";
                }

                activeChat.history.pop();
                saveState();
                renderChat();
                showInputArea(); 

                let notice = "Your prompt has been saved back to the input box.";
                
                if (!isNews && (errStr.includes("429") || errStr.includes("quota") || errStr.includes("exhausted"))) {
                    if (modelSelect.selectedIndex < modelSelect.options.length - 1) {
                        modelSelect.selectedIndex += 1;
                        notice += `\n\nRate limit hit! Auto-downgraded to ${modelSelect.value}. Press Send to try again.`;
                    } else {
                        notice += "\n\nYou are on the lowest model. Quota exhausted.";
                    }
                } else if (isNews) {
                    notice += "\n\nSearch grounding failed. Try a different key or disable News mode.";
                }

                alert(`API Error: ${error.message}\n\n${notice}`);
            }
        }

        // Bootstrap
        window.onload = init;
    </script>
</body>
</html>
